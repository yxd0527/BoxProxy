variables {

//百度直连IP更改
destaddr = 183.240.98.84:443;
//cns信息更改   
cns_server = 1.1.1.1:443;
cns_passwd = 778899;
        
tunnel_header = "[M] [H] [V]\r\n\r\n[M]Host: pushbos.baidu.com\r\nHTTP/1.1\r\nHost: pushbos.baidu.com\r\nProxy-Connection: Keep-Alive\r\nConnection: Keep-Alive\r\nUser-Agent: okhttp/3.11.0 Dalvik/2.1.0 (Linux; U; Android 16;  Xiaomi 17 Pro Build/BP2A.250605.031.A3) baiduboxapp/13.10.0.10 (Baidu; P1 16)\r\nX-T5-Auth: 1109293052\r\nbaiduboxapp\r\n";

cns_header = "GET http://pushbos.baidu.com/ [V]\r\nMeng: [H]\r\nHost: pushbos.baidu.com\r\n";

}
#######UDP部分########
httpUDP::udp {
    udp_socks5_listen = 0.0.0.0:1081
    udp_tproxy_listen = 0.0.0.0:6650;
    httpMod = clns_https_request;
    destAddr = ${cns_server};
    encrypt = ${cns_passwd};
}

tcp::Global {
    tcp_listen = :::6650;
}

tcpProxy::https_proxy {
    destAddr4 = ${destaddr};
    tunnel_proxy = on;
    tunnelHttpMod = tunnel;
}
httpMod::tunnel {
    del_line = host;
    set_first = ${tunnel_header};
}
tcpProxy::https_cns_proxy {
	destAddr = ${cns_server};
	tunnel_proxy = on;
	tunnelHttpMod = clns_https_request;
	tunnel_encrypt = ${cns_passwd};
}    
httpMod::clns_https_request {
	del_line = host;
	set_first = ${cns_header};
}
   
//ssl端口先建立CONNECT连接
tcpAcl::firstconnect {
    tcpProxy = https_proxy;
    dst_port = 1:21;
    dst_port = 23:445;            
    dst_port = 447:65535;
    
}
        
//匹配其他请求
tcpAcl::CONNECT {
    tcpProxy = https_cns_proxy;
    dst_port != 0;
}

dns::Global {
    dns_listen = :::6653;
    cachePath = /dev/null;
}
dnsAcl {
    tunnelHttpMod = tunnel;
    destAddr4 = ${destaddr};
    header_host = 119.29.29.29:80;
}

//用于接收socks5请求
socks5::recv_socks5 {
    socks5_listen = 0.0.0.0:1081;
    socks5_dns = 127.0.0.1:6653;
    handshake_timeout = 60;
}

Tun {
    tunAddr4 = 10.0.0.1;
    tunAddr6 = fc00::1;
    tunMtu = 1500;
    tunDevice = tunDev;
}