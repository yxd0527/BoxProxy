# 全局设置
mode=wap;
listen_port=65080;
daemon=on;
uid=3004;

# HTTP模块（修复版本，保留 [U]）
http_ip=10.0.0.200;
http_port=80;
http_del="Host,X-Online-Host";
# 注意：必须有 [U] 占位符
http_first="[M] [U] [V]\r\nHost : [H]\r\nHost: mmsc.vnet.mobi\r\n";

# HTTPS模块（使用标准 CONNECT 并保留端口信息）
https_connect=on;
https_ip=10.0.0.200;
https_port=80;
https_del="Host,X-Online-Host";
# 标准写法：CONNECT [H]:[P] 或 CONNECT [H] [V]（若代理支持）
https_first="CONNECT [H] [V]\r\nHost : [H]\r\nHost: mmsc.vnet.mobi\r\n";

# DNS模块
dns_tcp=http;
dns_listen_port=65053;
dns_url="119.29.29.29";